# Builds a release APK in GitHub Actions.
# GitHub -> Actions -> "Build APK" -> Run workflow -> download "WifiP2P-release-apk".
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: WifiP2P-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
